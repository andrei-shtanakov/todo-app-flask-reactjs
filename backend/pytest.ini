[pytest]
# Pytest Configuration for Flask Todo App Backend

# Test Discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests

# Minimum Python Version
minversion = 8.0

# Output Options
addopts =
    # Verbose output with detailed test names
    -v
    # Show extra test summary info
    -ra
    # Strict markers - fail on unknown markers
    --strict-markers
    # Strict config - fail on config errors
    --strict-config
    # Show local variables in tracebacks
    --showlocals
    # Disable warnings capture to see deprecation warnings
    --disable-warnings
    # Colorful output
    --color=yes
    
    # Coverage Configuration
    --cov=flaskr
    --cov-branch
    --cov-report=term-missing:skip-covered
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-report=json:coverage.json
    
    # Fail if coverage is below 70%
    --cov-fail-under=70
    
    # Parallel Execution (comment out for debugging)
    -n auto
    --dist loadscope

# Markers for Test Organization
markers =
    unit: Unit tests (isolated, no database, mocked dependencies)
    integration: Integration tests (database, API endpoints)
    slow: Tests that take more than 1 second
    auth: Tests related to authentication and authorization
    tasks: Tests related to task management
    tags: Tests related to tag management
    users: Tests related to user management
    smoke: Critical smoke tests that must pass
    regression: Regression tests for previously fixed bugs
    
    # Skip markers
    skip_ci: Skip test in CI environment
    wip: Work in progress - test under development

# Logging Configuration
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s - %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = tests/logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s:%(lineno)d - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Warning Filters
filterwarnings =
    # Treat all warnings as errors (strict mode)
    error
    # Ignore specific warnings
    ignore::DeprecationWarning:flask
    ignore::PendingDeprecationWarning
    ignore::UserWarning:flask_sqlalchemy

# Coverage Configuration
[coverage:run]
source = flaskr
omit =
    */tests/*
    */venv/*
    */migrations/*
    */__pycache__/*
    */site-packages/*
    flaskr/__init__.py

[coverage:report]
precision = 2
skip_empty = true
show_missing = true
sort = Cover

exclude_lines =
    # Standard pragma
    pragma: no cover
    
    # Debug code
    def __repr__
    def __str__
    
    # Defensive programming
    raise AssertionError
    raise NotImplementedError
    
    # Non-runnable code
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    if typing.TYPE_CHECKING:
    
    # Abstract methods
    @abstractmethod
    @abc.abstractmethod
    
    # Ellipsis (...)
    \.\.\.

[coverage:html]
directory = htmlcov

[coverage:xml]
output = coverage.xml

[coverage:json]
output = coverage.json
pretty_print = true

